<div>
  <header-component
    (filterItem)="setItems($event)"
    (searchItem)="setItems($event)"
    (setMount)="setIsMount($event)"
  ></header-component>

  <body class="items">
    @if(isMount){
       @if(items !== '[]'){
          <formitem-component [items]="items"></formitem-component>
        } @else {
          <h1 class="notfound-elem">Публикаций не нашлось :(</h1>
        } 
    } @else {
      <load-component></load-component>
    }
  </body>
</div>
